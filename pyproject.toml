[build-system]
requires = ["uv_build>=0.12.0,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "."

[project]
name = "lineage"
version = "0.1.0"
description = "Tree Hidden Markov Model analysis of cell lineages."
readme = "README.rst"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Meyer Lab" }]
dependencies = [
    "numpy>=2.2.0",
    "scipy>=1.15.0",
    "scikit-learn>=1.6.0",
    "seaborn>=0.13.2",
    "drawsvg>=2.4.2",
    "openpyxl>=3.1.5",
    "biopython>=1.85",
    "networkx>=3.5",
    "pygraphviz>=2.0",
    "statsmodels>=0.15.0",
    "numba>=0.61.0",
]

[project.scripts]
fbuild = "lineage.figures.common:genFigure"

[project.optional-dependencies]
docs = [
    "Sphinx>=8.2.0",
    "sphinx-autoapi>=3.4.0",
    "sphinx-rtd-theme>=3.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-cov>=6.1",
    "pytest-xdist>=3.7",
    "hypothesis>=6.119",
    "ty",
    "ruff>=0.16.0",
]

[tool.ty.src]
exclude = ["docs/**", ".claude/**"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".claude"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = [
    "E501", # line length
]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = [
    "lineage/tests",
]
addopts = "-n auto"


