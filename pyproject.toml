[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lineage"
version = "0.1.0"
description = "Tree Hidden Markov Model analysis of cell lineages."
readme = "README.rst"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Meyer Lab" }]
dependencies = [
    "numpy",
    "scipy",
    "scikit-learn",
    "seaborn",
    "svgutils",
    "openpyxl",
    "biopython",
    "networkx",
    "pygraphviz",
    "statsmodels",
    "numba",
]

[project.scripts]
fbuild = "lineage.figures.common:genFigure"

[project.optional-dependencies]
docs = [
    "Sphinx>=4.5.0",
    "sphinx-autoapi>=1.8.4",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "pytest-xdist>=2.5.0",
    "ty",
    "ruff>=0.15.0",
]

[tool.ty.src]
exclude = ["docs/**"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = [
    "E501", # line length
]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = [
    "lineage/tests",
]


