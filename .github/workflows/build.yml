name: Build

on: [push]

jobs:
  build:
    runs-on: self-hosted
    steps:
    - uses: actions/checkout@v4
    - name: Install uv
      uses: astral-sh/setup-uv@v5
    - name: Install dependencies
      run: uv sync
    - name: Build figures
      run: make all -j 12
    - name: Upload files
      uses: actions/upload-artifact@v4
      with:
        name: files
        path: output/*.svg
